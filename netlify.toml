[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/emergence"
  status = 302
  force = true

[[redirects]]
  from = "/emergence/manifesto"
  to = "/emergence/charter"
  status = 301
  force = true

[[redirects]]
  from = "/operate"
  to = "/join.html"
  status = 301
  force = true

[[redirects]]
  from = "/operate.html"
  to = "/join.html"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard-guide"
  to = "/dashboard-guide.html"
  status = 200

# Route /mesh-api/* to the Netlify Function (server-side proxy)
[[redirects]]
  from = "/mesh-api/*"
  to = "/.netlify/functions/mesh-api"
  status = 200
