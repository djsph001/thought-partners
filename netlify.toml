[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/emergence"
  status = 302
  force = true

[[redirects]]
  from = "/emergence/manifesto"
  to = "/emergence/charter"
  status = 301
  force = true

# Let Netlify handle 404s by default for unmatched routes

[[redirects]]
  from = "/operate"
  to = "/emergence/lattice-substrate"
  status = 301

[[redirects]]
  from = "/dashboard-guide"
  to = "/emergence/dashboard-guide"
  status = 301

