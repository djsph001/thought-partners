# Continuous deployment: djsph001/thought-partners -> Netlify "emergencecollective" (auto-deploys on push to main)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/emergence/manifesto"
  to = "/emergence/charter"
  status = 301
  force = true

[[redirects]]
  from = "/operate"
  to = "/join.html"
  status = 301
  force = true

[[redirects]]
  from = "/operate.html"
  to = "/join.html"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard-guide"
  to = "/dashboard-guide.html"
  status = 200

# Book route promoted to top level — preserve old /books/... links
[[redirects]]
  from = "/books/the-mycelium-of-meaning"
  to = "/mycelium-of-meaning"
  status = 301
  force = true

[[redirects]]
  from = "/books/the-mycelium-of-meaning/sample"
  to = "/mycelium-of-meaning/sample"
  status = 301
  force = true

# Institute books page merged into the global /books hub
[[redirects]]
  from = "/emergence/books"
  to = "/books"
  status = 301
  force = true

# Route /mesh-api/* to the reader function (serves pushed blob)
[[redirects]]
  from = "/mesh-api/*"
  to = "/.netlify/functions/mesh-api"
  status = 200

# Route /api/mesh-push to the receiver function
[[redirects]]
  from = "/api/mesh-push"
  to = "/.netlify/functions/mesh-push"
  status = 200

# Conventional /sitemap.xml alias -> the generated sitemap index
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200
  force = true
